name: CI

# Mirrors the local verification: PostgreSQL 16 + pgvector, Alembic migrations,
# then the Python suite and the browser-client unit tests.
#
# Safety: no production credentials, no LangSmith tracing, and no real LLM or TTS calls.
# Every key below is a placeholder; the suite mocks the LLM and stubs the voice bot.
# Redis is disabled because the suite uses a FakeRedis double for /readyz.
#
# The Pipecat voice stack is pinned through constraints-ci.txt to the versions the suite
# was validated against (pipecat-ai 1.12.0). requirements.txt alone would resolve a newer,
# untested release. See the header of constraints-ci.txt before changing the pins.
#
# The test job does not depend on quality: a lint or format finding must not stop the suite
# from running. Each job reports its own result.
#
# Lint tooling is pinned through constraints-ci.txt as well. An unpinned `pip install ruff`
# resolved 0.17.6 on 2026-11-25, whose default rule set is far wider than this repo was
# written against; ruff.toml now states the selected rules explicitly.
#
# NOT run here: the Chromium check (tests/js/voice-client.browser.mjs), real audio over a
# network, and anything against a hosted database.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_USER: voice_app
  POSTGRES_PASSWORD: ci-test-password
  POSTGRES_DB: voice_sales
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432
  REDIS_ENABLED: "false"
  GROQ_API_KEY: ci-placeholder-not-a-real-key
  GROQ_MODEL: openai/gpt-oss-20b
  TTS_PROVIDER: groq
  LANGSMITH_TRACING: "false"

jobs:
  # ---- Lint, format, type-check ----
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright -c constraints-ci.txt
          pip install -r requirements.txt -c constraints-ci.txt
      - name: Ruff lint
        run: ruff check api/ tests/ evals/ scripts/ voice/
      - name: Ruff format check
        run: ruff format --check api/ tests/ evals/ scripts/ voice/
      # pyright 1.1.414 has no --typeCheckingMode flag and its --level takes only
      # error|warning, so the previous `--level basic` exited on a usage error without
      # type-checking anything -- hidden by continue-on-error. The mode is left at the
      # default: on this codebase basic and standard report the same 49 diagnostics.
      - name: Pyright type check
        run: pyright api/ --pythonversion 3.13
        continue-on-error: true

  # ---- Security / dependency audit ----
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety
          pip install -r requirements.txt -c constraints-ci.txt
      - name: pip-audit (known vulnerabilities)
        run: pip-audit --strict
        continue-on-error: true
      - name: Check for secrets in code
        run: |
          if git ls-files --cached | grep -qE '\.env$|\.pem$|\.key$'; then
            echo "ERROR: Secrets or key files are tracked in git"
            exit 1
          fi

  # ---- Backend + DB tests ----
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voice_app
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: voice_sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_app -d voice_sales"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies (voice stack pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-ci.txt

      - name: Show the resolved voice stack
        run: pip list 2>/dev/null | grep -iE "^(pipecat-ai|pipecat-ai-prebuilt|aiortc|langgraph|mcp) "

      - name: Create test database
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h 127.0.0.1 -U voice_app -d voice_sales \
            -c "CREATE DATABASE vsa_test OWNER voice_app;"
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://voice_app:ci-test-password@127.0.0.1:5432/vsa_test"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run Python test suite
        run: python -m pytest -q --tb=short
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://voice_app:ci-test-password@127.0.0.1:5432/vsa_test"

      - name: Run browser-client unit tests
        run: node --test tests/js/voice-client.test.mjs
