name: CI

# Mirrors the local verification in DEPLOYMENT.md: PostgreSQL 16 + pgvector,
# Alembic migrations, then the Python suite and the browser-client unit tests.
#
# Safety: no production credentials, no LangSmith tracing, and no real LLM or TTS calls.
# Every key below is a placeholder; the suite mocks the LLM and stubs the voice bot.
# Redis is disabled because the suite uses a FakeRedis double for /readyz.
#
# The Pipecat voice stack is pinned through constraints-ci.txt to the versions the suite
# was validated against (pipecat-ai 1.12.0). requirements.txt alone would resolve a newer,
# untested release. See the header of constraints-ci.txt before changing the pins.
#
# NOT run here: the Chromium check (tests/js/voice-client.browser.mjs), real audio over a
# network, and anything against a hosted database.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voice_app
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: voice_sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_app -d voice_sales"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_USER: voice_app
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: voice_sales
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_ENABLED: "false"
      # Placeholders only: Settings requires these to construct; the suite mocks the LLM.
      GROQ_API_KEY: ci-placeholder-not-a-real-key
      GROQ_MODEL: openai/gpt-oss-20b
      TTS_PROVIDER: groq
      LANGSMITH_TRACING: "false"
      # VOICE_TOKEN_SECRET is deliberately NOT set: tests assert the unset default, and the
      # voice contract tests supply their own secret.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies (voice stack pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-ci.txt

      - name: Show the resolved voice stack
        run: pip list 2>/dev/null | grep -iE "^(pipecat-ai|pipecat-ai-prebuilt|aiortc) "

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Run browser-client unit tests
        run: node --test tests/js/voice-client.test.mjs
